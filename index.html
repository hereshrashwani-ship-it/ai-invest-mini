<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>AI Invest Mini</title><style>body{margin:0;background:#080e1a;color:#e9eef8;font:15px system-ui}header{padding:22px;background:#111d30;border-bottom:1px solid #26344b}h1{margin:0;font-size:24px}small,.muted{color:#9baec7}.wrap{max-width:900px;margin:auto;padding:18px}nav{display:flex;gap:8px;overflow:auto;padding:12px;background:#111d30}button{border:1px solid #34455f;border-radius:12px;padding:11px 14px;background:#19283f;color:white;cursor:pointer;white-space:nowrap}.active{background:#2467a9}.card{background:#142137;border:1px solid #293a53;border-radius:16px;padding:18px;margin:12px 0}h2{font-size:20px}h3{font-size:16px}input,textarea{box-sizing:border-box;width:100%;background:#0e1929;color:white;border:1px solid #40536b;border-radius:10px;padding:12px;margin:6px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px 6px;border-bottom:1px solid #314059}td:last-child,th:last-child{text-align:right}.pill{display:inline-block;border-radius:40px;background:#263f58;padding:5px 10px;color:#bcdcff}.green{color:#62dfaa}.amber{color:#ffcb77}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(max-width:420px){.grid{grid-template-columns:1fr}}a{color:#86c7ff} .hero{background:linear-gradient(120deg,#182d4b,#0f2d36);border:1px solid #2e5666;border-radius:22px;padding:22px;margin:12px 0}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:#9cb4ce;font-size:11px}.big{font-size:34px;font-weight:800;margin:7px 0}.meter{display:flex;height:12px;border-radius:20px;overflow:hidden;background:#34455f}.meter span:first-child{background:#edab58;width:50%}.meter span:last-child{background:#40c9a2;width:50%}.notice{background:#283449;border-left:3px solid #e5b45b;padding:12px;border-radius:8px;margin:12px 0}.tag{font-size:12px;background:#233951;border-radius:20px;padding:5px 10px}.red{color:#ff858d}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.mini{font-size:13px}.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.agents .card{margin:0}.dot{display:inline-block;width:9px;height:9px;background:#edb85d;border-radius:50%;margin-right:7px}select{background:#0e1929;color:#fff;border:1px solid #40536b;padding:10px;border-radius:10px} </style></head><body><header><h1>◈ AI Invest Mini</h1><small>Din investeringsöversikt · Analys, inte handel</small></header><nav id="nav"></nav><main class="wrap" id="main"></main><script>
const tabs=['Översikt','Köp & sälj','Portfölj','5 agenter','Nyheter','Rapporter'];let tab=0;const initial=[['IonQ',1437],['Quantum Computing Inc.',313],['Avanza Global',4629],['DNB Global Indeks S',4620],['Länsförsäkringar Global Index',4601]];let holdings=JSON.parse(localStorage.getItem('holdings')||'null')||initial;let reports=JSON.parse(localStorage.getItem('reports')||'[]');let news=JSON.parse(localStorage.getItem('news')||'[]');let signals=JSON.parse(localStorage.getItem('signals')||'[]');const fmt=n=>new Intl.NumberFormat('sv-SE').format(n)+' kr';const save=()=>{localStorage.setItem('holdings',JSON.stringify(holdings));localStorage.setItem('reports',JSON.stringify(reports));localStorage.setItem('news',JSON.stringify(news));localStorage.setItem('signals',JSON.stringify(signals))};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){document.getElementById('nav').innerHTML=tabs.map((t,i)=>`<button class="${i===tab?'active':''}" onclick="tab=${i};render()">${t}</button>`).join('');let total=holdings.reduce((s,x)=>s+Number(x[1]),0);let html='';if(tab===0)html=`<div class="hero"><div class="eyebrow">Min investeringscentral</div><div class="big">${fmt(total)}</div><div class="muted">Senast manuellt registrerat portföljvärde · inte live</div><div class="grid"><div><h3>4 000 kr / mån</h3><small>Månadssparande</small></div><div><h3>5+ år</h3><small>Investeringshorisont</small></div></div><div class="meter"><span></span><span></span></div><p class="mini">🟠 50 % högrisk (2 000 kr) &nbsp; 🟢 50 % balanserat (2 000 kr)</p></div><div class="grid"><div class="card"><div class="eyebrow">Mina innehav</div><h2>5 bevakade</h2><p class="muted">IonQ, QCI och tre globalfonder</p><button onclick="tab=2;render()">Visa portfölj</button></div><div class="card"><div class="eyebrow">AI-agenter</div><h2>5 roller</h2><p class="amber">Inväntar datakoppling</p><button onclick="tab=3;render()">Visa agenter</button></div></div><div class="card"><h2>🔔 Senaste signaler</h2>${signals.length?signals.slice(0,3).map(x=>`<p><span class="tag">${esc(x.action)}</span> <b>${esc(x.name)}</b> · ${esc(x.date)}</p>`).join(''):'<div class="notice">Inga verifierade köp- eller säljsignaler har lagts in ännu.</div>'}<button onclick="tab=1;render()">Köp & sälj</button></div><div class="card"><h2>📰 Nyhetsflöde</h2>${news.length?news.slice(0,3).map(x=>`<p><b>${esc(x.title)}</b><br><small>${esc(x.date)}</small></p>`).join(''):'<p class="muted">Nyhetsflödet väntar på en godkänd datakälla. Vi visar inte påhittade börsnyheter.</p>'}<button onclick="tab=4;render()">Visa nyheter</button></div><div class="notice">De schemalagda AI-rapporterna skickas fortfarande via ChatGPT. Denna app har ännu ingen automatisk synkning, realtidskurser eller pushnotiser.</div>`;
if(tab===1)html=`<div class="card"><h2>🎯 Köp- och säljsignaler</h2><p class="muted">Signaler kräver aktuell analys med källa. Inga automatiska affärer görs.</p>${signals.length?signals.map((x,i)=>`<div class="card"><span class="tag">${esc(x.action)}</span><h3>${esc(x.name)}</h3><p>${esc(x.reason)}</p><small>${esc(x.date)} · ${esc(x.source)}</small><p><button onclick="removeSignal(${i})">Ta bort</button></p></div>`).join(''):'<div class="notice">Inga aktiva signaler. Lägg in en verifierad analys när den finns.</div>'}</div><div class="card"><h3>Spara analys / signal</h3><input id="sigName" placeholder="Bolag eller fond"><select id="sigAction"><option>Bevaka</option><option>Möjligt köp</option><option>Ompröva innehav</option><option>Möjlig försäljning</option></select><textarea id="sigReason" rows="3" placeholder="Motivering, risker och analysdatum"></textarea><input id="sigSource" placeholder="Källa / länk till analys"><button onclick="addSignal()">Spara signal</button></div>`;
if(tab===2)html=`<div class="card"><h2>📊 Min portfölj</h2><table><tr><th>Innehav</th><th>Registrerat värde</th></tr>${holdings.map(x=>`<tr><td>${esc(x[0])}</td><td>${fmt(x[1])}</td></tr>`).join('')}</table><p class="muted">Värden från tidigare skärmbilder eller dina egna ändringar. För daglig uppgång/nedgång behöver vi marknadsdata och inköpsinformation.</p></div><div class="card"><h3>Lägg till innehav</h3><input id="name" placeholder="Aktie eller fond"><input id="value" type="number" min="0" step="0.01" placeholder="Värde i kr"><div class="btnrow"><button onclick="addHolding()">Spara innehav</button><button onclick="resetHoldings()">Återställ startvärden</button></div></div>`;
if(tab===3)html=`<h2>🤖 Fem separata AI-agenter</h2><div class="agents">${[['🌍','Marknadsagent','Hittar trender, sektorer och intressanta kandidater'],['📰','Nyhetsagent','Följer bolagsnyheter, rapporter och viktiga händelser'],['📈','Analysagent','Granskar fundamenta, värdering och tekniska nivåer'],['🛡️','Riskagent','Letar efter varningssignaler och koncentrationsrisk'],['🧠','Chefsagent','Väger samman alla perspektiv till tydliga slutsatser']].map((a,i)=>`<div class="card"><div class="eyebrow">Agent ${i+1}</div><h2>${a[0]} ${a[1]}</h2><p>${a[2]}</p><span class="dot"></span><small>Inte ansluten till hemsidan ännu</small></div>`).join('')}</div><div class="notice">Dina fem analysroller används som upplägg i ChatGPT-rapporterna, men körs inte självständigt på denna webbsida.</div>`;
if(tab===4)html=`<div class="card"><h2>📰 Nyhetsflöde</h2><p class="muted">Här ska ett automatiskt flöde från tillförlitliga nyhetskällor visas. Tills det är anslutet kan du spara artiklar själv.</p>${news.map((x,i)=>`<div class="card"><h3>${esc(x.title)}</h3><small>${esc(x.date)}</small><p>${esc(x.summary)}</p>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Öppna källa</a>`:''} <button onclick="removeNews(${i})">Ta bort</button></div>`).join('')}<h3>Lägg till nyhet</h3><input id="newsTitle" placeholder="Rubrik"><textarea id="newsSummary" rows="3" placeholder="Kort sammanfattning"></textarea><input id="newsUrl" placeholder="https:// källa"><button onclick="addNews()">Spara nyhet</button></div><div class="card"><h2>🔔 Notiser</h2><p class="muted">Du kan ge tillstånd för lokala notiser på en kompatibel enhet. Automatisk push kräver en server och särskild anslutning.</p><button onclick="enableNotifications()">Kontrollera notistillstånd</button></div>`;
if(tab===5)html=`<div class="card"><h2>🗂️ Rapportarkiv</h2><p class="muted">Klistra in morgon- eller kvällsrapporten från ChatGPT. Den sparas lokalt på enheten.</p><input id="reportTitle" placeholder="Rapporttitel"><textarea id="reportText" rows="7" placeholder="Klistra in analys med källor och datum"></textarea><button onclick="addReport()">Spara rapport</button></div>${reports.map((r,i)=>`<div class="card"><h3>${esc(r.title)}</h3><small>${esc(r.date)}</small><p style="white-space:pre-wrap">${esc(r.body)}</p><button onclick="deleteReport(${i})">Ta bort</button></div>`).join('')}`;document.getElementById('main').innerHTML=html}function addSignal(){let name=document.getElementById('sigName').value.trim(),action=document.getElementById('sigAction').value,reason=document.getElementById('sigReason').value.trim(),source=document.getElementById('sigSource').value.trim();if(!name||!reason||!source)return alert('Fyll i bolag, motivering och källa');signals.unshift({name,action,reason,source,date:new Date().toLocaleString('sv-SE')});save();render()}function removeSignal(i){signals.splice(i,1);save();render()}function addNews(){let title=document.getElementById('newsTitle').value.trim(),summary=document.getElementById('newsSummary').value.trim(),url=document.getElementById('newsUrl').value.trim();if(!title||!summary)return alert('Ange rubrik och sammanfattning');if(url&&!/^https:\/\//i.test(url))return alert('Ange en https-länk');news.unshift({title,summary,url,date:new Date().toLocaleString('sv-SE')});save();render()}function removeNews(i){news.splice(i,1);save();render()}async function enableNotifications(){if(!('Notification' in window))return alert('Notiser stöds inte här.');let result=await Notification.requestPermission();alert(result==='granted'?'Notistillstånd är aktiverat. Automatisk push är ännu inte inkopplad.':'Notiser är inte aktiverade.')}function addHolding(){let n=document.getElementById('name').value.trim(),v=Number(document.getElementById('value').value);if(!n||!Number.isFinite(v)||v<0)return alert('Ange ett namn och ett giltigt värde');holdings.push([n,v]);save();render()}function resetHoldings(){if(confirm('Återställ innehaven?')){holdings=initial.map(x=>[...x]);save();render()}}function addReport(){let title=document.getElementById('reportTitle').value.trim(),body=document.getElementById('reportText').value.trim();if(!title||!body)return alert('Ange titel och rapport');reports.unshift({title,body,date:new Date().toLocaleString('sv-SE')});save();render()}function deleteReport(i){reports.splice(i,1);save();render()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
